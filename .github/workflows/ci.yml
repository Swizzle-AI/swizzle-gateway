name: Gateway CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Run Go Tests
      run: go test -v -race ./...
    - name: Build Gateway
      run: go build -v -o bin/swizzle-gateway .
